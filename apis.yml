aid: cleanco
name: CleanCo
description: >-
  CleanCo is a United Kingdom-based beverage company, founded in 2019 by Spencer
  Matthews, that produces premium low- and no-alcohol alternative spirits. Its
  product line replicates the flavour profiles of traditional spirits across key
  categories, including CleanGin, CleanRum, CleanVodka and CleanTequila, aimed at
  consumers who want to reduce alcohol consumption without sacrificing taste. The
  company sells direct-to-consumer through cleanliquor.com and through grocery and
  hospitality retail channels across the UK and international markets. CleanCo
  raised venture funding from Lightspeed Venture Partners in 2020. It is a consumer
  packaged-goods brand and does not publish a developer API, developer portal, or
  any machine-readable API surface; it is retained in the API Evangelist network
  only as an identified Lightspeed portfolio company, not as an API provider.
